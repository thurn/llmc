[package]
name = "llmc"
version = "0.1.0"
edition = "2024"
description = "Rust CLI for coordinating multiple AI agents in parallel git worktrees"
license = "Apache-2.0"
repository = "https://github.com/dthurn/llmc"

[[bin]]
name = "llmc"
test = false
doctest = false
bench = false

[dependencies]
anyhow = "1.0"
atomic-write-file = "0.2"
clap = { version = "4", features = ["derive"] }
fastrand = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
